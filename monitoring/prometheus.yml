# Prometheus Configuration for WFO Metrics
# PASSO 27.4 - Walk-Forward Optimization Monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'wfo-monitor'
    environment: 'production'

# Alerting configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  # - "alerts.yml"

# Scrape configurations
scrape_configs:
  # WFO Metrics Exporter
  - job_name: 'wfo_metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['wfo-exporter:9090']
        labels:
          service: 'wfo'
          component: 'optimizer'
  
  # MetaBacktester API (se expuser métricas)
  - job_name: 'execution_engine'
    scrape_interval: 15s
    static_configs:
      - targets: ['execution-engine:8001']
        labels:
          service: 'backtest'
          component: 'engine'
  
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9091']
